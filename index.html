<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tail cut - AI 꼬리물기 자동 단속 &amp; 신고 시스템</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-950/50 backdrop-blur sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2 cursor-pointer" onclick="location.reload()">
        <div class="bg-red-600 text-white p-2 rounded-lg font-black text-xl flex items-center justify-center w-9 h-9">
          T
        </div>
        <span class="font-extrabold text-xl tracking-tight text-white">tail<span class="text-red-500">cut</span></span>
      </div>
      <a href="#" class="text-sm text-slate-400 hover:text-white transition">메인으로 돌아가기</a>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8">
    <div class="bg-slate-800/50 border border-slate-700/50 rounded-2xl p-6 shadow-xl backdrop-blur-sm">
      <h2 class="text-xl font-bold text-slate-100 mb-2 flex items-center gap-2">
        <i data-lucide="message-square-plus" class="w-6 h-6 text-red-500"></i>
        의견 및 피드백 게시판
      </h2>
      <p class="text-sm text-slate-400 mb-6">서비스에 대한 의견이나 개선사항을 자유롭게 남겨주세요.</p>

      <!-- ① 입력창 및 등록 버튼 -->
      <form id="commentForm" class="mb-8 space-y-3">
        <div class="flex gap-3">
          <input 
            type="text" 
            id="authorInput" 
            placeholder="작성자 이름" 
            required
            class="w-1/3 bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-red-500 transition text-sm"
          />
        </div>
        <div class="flex gap-3">
          <textarea 
            id="contentInput" 
            rows="3" 
            placeholder="의견을 입력하세요..." 
            required
            class="w-full bg-slate-900/80 border border-slate-700 rounded-xl p-4 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-red-500 transition text-sm resize-none"
          ></textarea>
        </div>
        <div class="flex justify-end">
          <button 
            type="submit" 
            id="submitBtn"
            class="bg-red-600 hover:bg-red-500 text-white px-6 py-2.5 rounded-xl font-semibold text-sm transition shadow-lg shadow-red-900/30 flex items-center gap-2 cursor-pointer"
          >
            <i data-lucide="send" class="w-4 h-4"></i>
            등록하기
          </button>
        </div>
      </form>

      <!-- ② 게시판 목록 영역 (최신순) -->
      <div class="border-t border-slate-700/50 pt-6">
        <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-4 flex items-center gap-2">
          <i data-lucide="message-circle" class="w-4 h-4 text-red-400"></i>
          등록된 의견 (<span id="commentCount">0</span>)
        </h3>

        <!-- 로딩 상태 -->
        <div id="loading" class="text-center py-8 text-slate-400 text-sm flex items-center justify-center gap-2">
          <i data-lucide="loader-2" class="w-5 h-5 animate-spin text-red-500"></i>
          의견을 불러오는 중입니다...
        </div>

        <!-- 게시글 데이터 출력 영역 -->
        <div id="commentList" class="space-y-3 hidden">
          <!-- JS로 동적 추가됨 -->
        </div>

        <!-- 데이터 없을 때 -->
        <div id="emptyList" class="hidden text-center py-8 text-slate-500 text-sm">
          아직 등록된 의견이 없습니다. 첫 번째 의견을 남겨보세요!
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-900 py-6 text-center text-xs text-slate-500">
    © 2026 tail cut. Powered by Google Gemini API &amp; Firebase.
  </footer>

  <!-- Firebase SDK (Modular) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      onSnapshot, 
      query, 
      orderBy, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ③ 제공받은 Firebase 설정값 적용
    const firebaseConfig = {
      apiKey: "AIzaSyDiHYxXGtCSL1ONL18psJJKXmEuLsU_3Ds",
      authDomain: "tail-cut.firebaseapp.com",
      projectId: "tail-cut",
      storageBucket: "tail-cut.firebasestorage.app",
      messagingSenderId: "52753970107",
      appId: "1:52753970107:web:36c83a538631caf3644a9e",
      measurementId: "G-M9K5ZNXDRN"
    };

    // Firebase 초기화
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const commentsCol = collection(db, "comments");

    // DOM 요소
    const commentForm = document.getElementById('commentForm');
    const authorInput = document.getElementById('authorInput');
    const contentInput = document.getElementById('contentInput');
    const submitBtn = document.getElementById('submitBtn');
    const commentList = document.getElementById('commentList');
    const commentCount = document.getElementById('commentCount');
    const loading = document.getElementById('loading');
    const emptyList = document.getElementById('emptyList');

    // Lucide 아이콘 초기화
    lucide.createIcons();

    // ⑤ 최신순 정렬(createdAt 기준 내림차순) 쿼리 작성 및 실시간 동기화
    const q = query(commentsCol, orderBy("createdAt", "desc"));

    // ② 앱 열릴 때 / 데이터 변경 시 목록 자동 업데이트 (onSnapshot)
    onSnapshot(q, (snapshot) => {
      loading.classList.add('hidden');
      commentList.innerHTML = '';

      if (snapshot.empty) {
        emptyList.classList.remove('hidden');
        commentList.classList.add('hidden');
        commentCount.innerText = '0';
        return;
      }

      emptyList.classList.add('hidden');
      commentList.classList.remove('hidden');
      commentCount.innerText = snapshot.docs.length;

      snapshot.forEach((doc) => {
        const data = doc.data();
        const dateStr = data.createdAt 
          ? new Date(data.createdAt.toDate()).toLocaleString('ko-KR', {
              year: 'numeric', month: '2-digit', day: '2-digit',
              hour: '2-digit', minute: '2-digit'
            })
          : '방금 전';

        const item = document.createElement('div');
        item.className = "p-4 bg-slate-900/60 border border-slate-800 rounded-xl space-y-1.5 transition hover:border-slate-700";
        item.innerHTML = `
          <div class="flex items-center justify-between text-xs">
            <span class="font-bold text-red-400">${escapeHtml(data.author || '익명')}</span>
            <span class="text-slate-500">${dateStr}</span>
          </div>
          <p class="text-sm text-slate-200 whitespace-pre-line">${escapeHtml(data.content || '')}</p>
        `;
        commentList.appendChild(item);
      });
    }, (error) => {
      console.error("Firestore Error:", error);
      loading.innerText = "데이터를 불러오는 중 오류가 발생했습니다.";
    });

    // ① 글 입력 후 등록 시 Firestore 저장 (클라이언트 SDK 사용 / 서비스 계정 키 없음)
    commentForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const author = authorInput.value.trim();
      const content = contentInput.value.trim();

      if (!author || !content) return;

      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-50');

      try {
        await addDoc(commentsCol, {
          author: author,
          content: content,
          createdAt: serverTimestamp()
        });

        contentInput.value = '';
      } catch (err) {
        console.error("저장 실패:", err);
        alert("글 등록에 실패했습니다. 다시 시도해주세요.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-50');
      }
    });

    // XSS 방지용 이스케이프
    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
